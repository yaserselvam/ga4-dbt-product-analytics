name: 'ga4_product_analytics_snowflake'
version: '1.0.0'
config-version: 2

# Snowflake port of the BigQuery project one directory up. Same marts, same tests,
# same business logic; the staging layer reads a Fivetran-landed (or bulk COPY-loaded)
# GA4 export and flattens it with LATERAL FLATTEN instead of BigQuery UNNEST.
profile: 'ga4_product_analytics_snowflake'

model-paths: ["models"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Force Monday-start weeks so retention cohorts match the BigQuery build exactly,
# regardless of the account's WEEK_START default.
models:
  ga4_product_analytics_snowflake:
    staging:
      +materialized: view
    marts:
      +materialized: table

on-run-start:
  - "alter session set week_start = 1"
